# Column mapping for Heliene Asset Essentials work-order exports.
#
# Headers (9 columns, BOM-prefixed):
#   'Work Order #', 'Title', 'WO Status', 'Priority', 'Origin',
#   'Source Asset', 'Source User', 'Assigned', 'Expected'
#
# A real export (06/25/2026) showed that, unlike earlier samples:
#   * Origin is DISCRIMINATING — values "PM" and "Non-PM" (46 PM / 41 Non-PM).
#   * WO Status has "040 SCHEDULED" AND "041 IN PROGRESS" (both are active/open).
#   * Source User varies (the WO creator/requester), so it is NOT the technician.
#
# The KEYS below are the canonical internal names the code uses everywhere.
# The VALUES are the actual headers from the export. Set a value to `null`
# when the export does not contain that column — the code degrades gracefully.

columns:
  work_order_id: "Work Order #"
  title:         "Title"
  status:        "WO Status"
  priority:      "Priority"
  asset:         "Source Asset"
  due_date:      "Expected"        # expected-completion datetime == due date
  created_date:  "Assigned"        # datetime the WO was assigned/scheduled; best available age/creation proxy

  # Extra columns present in this export, kept because they are useful:
  origin:        "Origin"          # WO category: "PM" vs "Non-PM" — authoritative PM signal
  requested_by:  "Source User"     # the WO creator/requester (varies); NOT the assigned technician

  # Columns the spec template expects but that are NOT in this export.
  # Leave as null; the dashboard shows an informational note instead of an empty chart.
  assigned_to:   null              # no per-technician/assignee column in the saved view's export
  location:      null              # no location/area column in this export

read:
  # The header row carries a UTF-8 BOM (﻿), so always read with utf-8-sig.
  encoding: "utf-8-sig"

filters:
  # Active (open) work orders. Matching is on the LEADING numeric code, so
  # "040", "40", "040 SCHEDULED", "041 IN PROGRESS" all match. Both 040
  # (scheduled) and 041 (in progress) are open work; completed codes are excluded.
  active_status_values: ["040", "041"]

classification:
  # PM vs Non-PM is taken from the CMMS Origin column (authoritative) — the export
  # tags every work order "PM" or "Non-PM". The title only splits PMs into streams.
  #   classify_by: "origin"  -> is_pm = (origin == origin_pm_value)   [preferred]
  #   classify_by: "title"   -> is_pm = title matches pm_pattern       [fallback]
  # If classify_by is "origin" but the export has no Origin column, the code falls
  # back to the title rule automatically.
  classify_by:    "origin"
  origin_pm_value: "PM"

  # Title patterns (word-boundary, case-insensitive). \bPM-ME\b marks the
  # Mechatronics stream; \bPM\b is the title fallback for is_pm. \bPM\b correctly
  # excludes EQUIPMENT / PUMP / RPM / PPM / PMP.
  me_pattern:  '\bPM-ME\b'     # Mechatronics (ME) PM work order
  pm_pattern:  '\bPM\b'        # any PM work order (title-mode fallback only)
